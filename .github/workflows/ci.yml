name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # the service-role key must never reach a browser bundle
      - name: no service role key in client bundle
        run: |
          if grep -rIl "SUPABASE_SERVICE_ROLE_KEY" .next/static 2>/dev/null; then
            echo "service role key leaked into the client bundle"; exit 1
          fi
          echo "clean"

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: replay migrations on a clean stack
        run: supabase db start
      - name: migrations apply twice (idempotency of the stack, not the seed)
        run: |
          supabase db reset
          supabase db reset
      - name: seed twice, second run must change nothing
        run: |
          supabase db reset
          psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')" -f supabase/seed.sql
          psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '"')" -f supabase/seed.sql
